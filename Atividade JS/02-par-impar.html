<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Par ou Ímpar</title>
</head>
<body>

    <h1>Par ou Ímpar</h1>

    <label for="numero">Digite um número:</label>
    <input type="number" id="numero">
    <br><br>

    <button onclick="verificar()">Verificar</button>

    <p id="resultado"></p>

    <script>
        function verificar() {
            var numero = parseInt(document.getElementById("numero").value);

            if (numero % 2 === 0) {
                document.getElementById("resultado").textContent = numero + " é PAR.";
            } else {
                document.getElementById("resultado").textContent = numero + " é ÍMPAR.";
            }
        }
    </script>

</body>
</html>
