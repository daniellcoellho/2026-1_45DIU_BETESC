<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Tarefa</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header>
        <h1>Nova Tarefa</h1>
        <p>Preencha o formulário abaixo</p>
    </header>

    <nav>
        <a href="index.html">Início</a>
        <a href="tarefas.html">Tarefas</a>
        <a href="nova-tarefa.html">Nova Tarefa</a>
        <a href="sobre.html">Sobre</a>
        <a href="recursos.html">Recursos HTML</a>
    </nav>

    <main>
        <section>
            <h2>Cadastrar tarefa</h2>

            <form action="#" method="post">
                <label for="titulo">Título da tarefa</label>
                <input type="text" id="titulo" name="titulo" placeholder="Digite o título">

                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao" placeholder="Descreva a tarefa"></textarea>

                <label for="prioridade">Prioridade</label>
                <select id="prioridade" name="prioridade">
                    <option value="baixa">Baixa</option>
                    <option value="media">Média</option>
                    <option value="alta">Alta</option>
                </select>

                <button type="submit">Salvar tarefa</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Formulário simples em HTML</p>
    </footer>

</body>
</html>
